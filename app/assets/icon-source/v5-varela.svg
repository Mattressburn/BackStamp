<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Backstamp cream flower icon, version three</title>
  <desc>An avocado stamp with large hand-set arc letters, four plain nesting bowls, and a rhythmic gold daisy border.</desc>
  <defs>
    <g id="gold-daisy">
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(60)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(120)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(180)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(240)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(300)"/>
      <circle r="13" fill="#8A4B23"/>
    </g>
    <path id="bowl-smallest-shape" d="M414 386Q512 372 610 386c-5 62-42 102-98 102s-93-40-98-102Z"/>
    <path id="bowl-medium-shape" d="M370 447q142-18 284 0c-7 78-61 126-142 126s-135-48-142-126Z"/>
    <path id="bowl-large-shape" d="M326 518q186-22 372 0c-8 88-79 142-186 142s-178-54-186-142Z"/>
    <path id="bowl-largest-shape" d="M278 592q234-26 468 0c-10 106-99 172-234 172s-224-66-234-172Z"/>
    <path id="rim-smallest" d="M414 386q98-14 196 0v16q-98-14-196 0Z"/>
    <path id="rim-medium" d="M370 447q142-18 284 0v16q-142-18-284 0Z"/>
    <path id="rim-large" d="M326 518q186-22 372 0v16q-186-22-372 0Z"/>
    <path id="rim-largest" d="M278 592q234-26 468 0v16q-234-26-468 0Z"/>
  </defs>

  <rect width="1024" height="1024" fill="#F1E7D3"/>
  <g aria-label="Six gold daisies in a wallpaper rhythm">
    <use href="#gold-daisy" transform="translate(92 154) rotate(-14) scale(.76)"/>
    <use href="#gold-daisy" transform="translate(350 62) rotate(14) scale(.62)"/>
    <use href="#gold-daisy" transform="translate(674 62) rotate(-14) scale(.62)"/>
    <use href="#gold-daisy" transform="translate(932 174) rotate(14) scale(.74)"/>
    <use href="#gold-daisy" transform="translate(944 816) rotate(-14) scale(.72)"/>
    <use href="#gold-daisy" transform="translate(116 866) rotate(14) scale(.78)"/>
  </g>

  <g fill="none" stroke="#D8C9A6" transform="translate(0 14)">
    <circle cx="512" cy="512" r="430" stroke-width="20"/>
    <circle cx="512" cy="512" r="280" stroke-width="14"/>
  </g>
  <g fill="none" stroke="#6E7A22">
    <circle cx="512" cy="512" r="430" stroke-width="20"/>
    <circle cx="512" cy="512" r="280" stroke-width="14"/>
  </g>

  <g id="wordmark" aria-label="BACKSTAMP" fill="#3A2C18" font-family="Varela Round" font-weight="900" text-anchor="middle">
    <text x="512" y="212" font-size="128" data-angle="-76" transform="rotate(-76 512 512)">B</text>
    <text x="512" y="212" font-size="128" data-angle="-57" transform="rotate(-57 512 512)">A</text>
    <text x="512" y="212" font-size="128" data-angle="-38" transform="rotate(-38 512 512)">C</text>
    <text x="512" y="212" font-size="128" data-angle="-19" transform="rotate(-19 512 512)">K</text>
    <text x="512" y="212" font-size="128" data-angle="0" transform="rotate(0 512 512)">S</text>
    <text x="512" y="212" font-size="128" data-angle="19" transform="rotate(19 512 512)">T</text>
    <text x="512" y="212" font-size="128" data-angle="38" transform="rotate(38 512 512)">A</text>
    <text x="512" y="212" font-size="128" data-angle="57" transform="rotate(57 512 512)">M</text>
    <text x="512" y="212" font-size="128" data-angle="76" transform="rotate(76 512 512)">P</text>
  </g>

  <g aria-label="Four plain round nesting bowls">
    <g fill="#D8C9A6" transform="translate(0 18)">
      <use href="#bowl-smallest-shape"/>
      <use href="#bowl-medium-shape"/>
      <use href="#bowl-large-shape"/>
      <use href="#bowl-largest-shape"/>
    </g>
    <use id="bowl-smallest" href="#bowl-smallest-shape" fill="#8A4B23"/>
    <use href="#rim-smallest" fill="#F1E7D3"/>
    <use id="bowl-medium" href="#bowl-medium-shape" fill="#6E7A22"/>
    <use href="#rim-medium" fill="#F1E7D3"/>
    <use id="bowl-large" href="#bowl-large-shape" fill="#D9A521"/>
    <use href="#rim-large" fill="#F1E7D3"/>
    <use id="bowl-largest" href="#bowl-largest-shape" fill="#B0472A"/>
    <use href="#rim-largest" fill="#F1E7D3"/>
  </g>
</svg>
