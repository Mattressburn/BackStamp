<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Backstamp banner icon, version two</title>
  <desc>A 1970s avocado label crosses a cream stamp with three colored bowls and a rhythmic gold daisy border.</desc>
  <defs>
    <g id="gold-daisy">
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(60)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(120)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(180)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(240)"/>
      <ellipse cx="0" cy="-30" rx="12" ry="26" fill="#D9A521" transform="rotate(300)"/>
      <circle r="13" fill="#8A4B23"/>
    </g>
    <path id="large-bowl-shape" d="M258 638 217 608q-10-8 0-16 4-4 12-4h87l22-28h348l22 28h87q8 0 12 4 10 8 0 16l-41 30h-34c-19 95-101 146-220 146s-201-51-220-146Z"/>
    <path id="medium-bowl-shape" d="M328 535 292 508q-9-7 0-14 4-4 12-4h67l19-26h244l19 26h67q8 0 12 4 9 7 0 14l-36 27h-23c-16 75-76 116-161 116s-145-41-161-116Z"/>
    <path id="small-bowl-shape" d="m391 433-29-21q-8-7 0-13 4-3 10-3h51l17-22h144l17 22h51q6 0 10 3 8 6 0 13l-29 21h-13c-13 61-55 94-108 94s-95-33-108-94Z"/>
  </defs>

  <rect width="1024" height="1024" fill="#F1E7D3"/>
  <g aria-label="Six gold daisies in a wallpaper rhythm">
    <use href="#gold-daisy" transform="translate(92 154) rotate(-14) scale(.76)"/>
    <use href="#gold-daisy" transform="translate(350 62) rotate(14) scale(.62)"/>
    <use href="#gold-daisy" transform="translate(674 62) rotate(-14) scale(.62)"/>
    <use href="#gold-daisy" transform="translate(932 174) rotate(14) scale(.74)"/>
    <use href="#gold-daisy" transform="translate(944 882) rotate(-14) scale(.72)"/>
    <use href="#gold-daisy" transform="translate(116 900) rotate(14) scale(.78)"/>
  </g>

  <g fill="none" stroke="#D8C9A6" transform="translate(0 14)">
    <circle cx="512" cy="512" r="430" stroke-width="20"/>
    <circle cx="512" cy="512" r="280" stroke-width="14"/>
  </g>
  <g fill="none" stroke="#6E7A22">
    <circle cx="512" cy="512" r="430" stroke-width="20"/>
    <circle cx="512" cy="512" r="280" stroke-width="14"/>
  </g>

  <g aria-label="Three nested Cinderella bowls" transform="translate(0 -90)">
    <use href="#large-bowl-shape" fill="#D8C9A6" transform="translate(0 18)"/>
    <use id="bowl-large" href="#large-bowl-shape" fill="#6E7A22" stroke="#F1E7D3" stroke-width="10" paint-order="stroke fill"/>
    <use href="#medium-bowl-shape" fill="#D8C9A6" transform="translate(0 16)"/>
    <use id="bowl-medium" href="#medium-bowl-shape" fill="#8A4B23" stroke="#F1E7D3" stroke-width="10" paint-order="stroke fill"/>
    <use href="#small-bowl-shape" fill="#D8C9A6" transform="translate(0 14)"/>
    <use id="bowl-small" href="#small-bowl-shape" fill="#D9A521" stroke="#F1E7D3" stroke-width="10" paint-order="stroke fill"/>
  </g>

  <rect x="0" y="669" width="1024" height="160" fill="#D8C9A6"/>
  <rect x="0" y="655" width="1024" height="160" fill="#6E7A22"/>
  <text id="wordmark" x="512" y="771" fill="#F1E7D3" font-family="Rubik Black" font-size="118" font-weight="900" letter-spacing="18" text-anchor="middle">BACKSTAMP</text>
</svg>
